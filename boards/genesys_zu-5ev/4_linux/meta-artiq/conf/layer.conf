BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-artiq"
BBFILE_PATTERN_meta-artiq = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-artiq = "6"

LAYERDEPENDS_meta-artiq = "core"
LAYERSERIES_COMPAT_meta-artiq = "scarthgap"
